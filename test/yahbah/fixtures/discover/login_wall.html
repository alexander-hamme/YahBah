<!doctype html>
<html>
<head><title>Sign in | Acme Careers</title></head>
<body>
  <main>
    <h1>Sign in to apply</h1>
    <p>You need a candidate account to apply for Senior Engineer.</p>
    <form id="signin" onsubmit="event.preventDefault()">
      <div><label for="user">Email address</label> <input id="user" name="user" type="email" autocomplete="username"></div>
      <div><label for="pass">Password</label> <input id="pass" name="pass" type="password" autocomplete="current-password"></div>
      <button type="submit">Sign in</button>
    </form>
    <p><a href="#create">Create an account</a></p>
  </main>
</body>
</html>
