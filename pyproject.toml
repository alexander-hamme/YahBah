[project]
name = "yahbah"
version = "0.1.0"
description = "Autonomous job application system"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "alembic>=1.14.0",
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "loguru>=0.7.3",
    "psycopg[asyncio]>=3.2.0",
    "pydantic-ai>=1.0.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "temporalio>=1.8.0",
    "fpdf2>=2.7.9",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "uvicorn[standard]>=0.34.0",
    "pyyaml>=6.0.3",
    "browser-use==0.13.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yahbah"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
markers = [
    "browser: launches a headless Chrome via browser-use (local fixture pages, no network)",
    "db: uses the disposable Postgres test database (TEST_DATABASE_URL); skipped if Postgres is down",
    "temporal: runs workflows on a local Temporal dev server (the `temporal` binary on PATH)",
    "live_llm: calls the real local models; opt-in only (-m live_llm or YAHBAH_LIVE_LLM=1)",
]
