[project]
name = "yahbah"
version = "0.1.0"
description = "Autonomous job application system"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "alembic>=1.14.0",
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "loguru>=0.7.3",
    "playwright>=1.49.0",
    "psycopg[asyncio]>=3.2.0",
    "pydantic-ai>=1.0.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "temporalio>=1.8.0",
    "fpdf2>=2.7.9",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yahbah"]
