ats_type: greenhouse
display_name: Greenhouse

agent_hints: |
  Greenhouse application forms may be embedded inside an iframe (#grnhse_app / #grnhse_iframe)
  on a company's own career page, or hosted directly at boards.greenhouse.io.
  The form is usually directly visible — you typically do NOT need to click an "Apply" button
  to reveal it, though there may be a tab to activate.
  Auth (account creation) may be required on some postings — look for a sign-in/sign-up form
  before the application fields appear.
  The submit button is usually labeled "Submit Application".
  If a cookie consent banner appears, always accept all cookies — the browser session is
  ephemeral so this has no lasting effect.

known_patterns:
  form_location: iframe_possible
  submit_button_selectors:
    - "button[type=submit]"
    - "input[type=submit]"
  auth_wall: possible
  email_verification: possible  # 8-char code sent to applicant email

# Human-approved updates accumulate here over time.
# Each entry records a specific pattern found and confirmed in production.
