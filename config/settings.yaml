# Runtime settings — all values are hot-reloadable via PUT /settings/{key}

testing_mode: false

# Gmail status polling
gmail_status_polling_enabled: false
gmail_status_polling_interval_minutes: 10
gmail_folder_label: "YahBah"
gmail_status_label: "YahBah/Status"

# What to do with verification code emails after extraction.
# Options: "archive" (move to YahBah folder), "delete" (trash), "nothing" (leave in inbox)
gmail_verification_code_action: "archive"

# Per-status auto-archive: true = move from inbox to YahBah folder,
# false = leave in inbox for immediate visibility.
gmail_auto_archive:
  UNDER_REVIEW: true
  ONLINE_ASSESSMENT: false
  INTERVIEW_REQUEST: false
  INTERVIEW_SCHEDULED: false
  OFFER: false
  REJECTED: true
  WITHDRAWN: true
  OTHER: true
